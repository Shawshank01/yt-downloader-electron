name: Mirror to GitLab

on:
  push:
    branches:
    - main
    tags:
    - 'v*'

concurrency:
  group: mirror-to-gitlab
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Push to GitLab
      run: |
        git remote add gitlab https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.com/michifumi/yt-downloader-electron.git
        if [ "${{ github.ref_type }}" = "branch" ]; then
          git push gitlab "refs/remotes/origin/${{ github.ref_name }}:refs/heads/${{ github.ref_name }}"
        else
          git push gitlab "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"
        fi
