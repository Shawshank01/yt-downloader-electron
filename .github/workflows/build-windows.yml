name: Build Windows installers

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  tools:
    uses: ./.github/workflows/build-tools.yml
    with:
      scope: windows

  build:
    needs: tools
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-latest
          arch: x64
          target: win32-x64
          builder_args: --win --x64
        - os: windows-11-arm
          arch: arm64
          target: win32-arm64
          builder_args: --win --arm64
    runs-on: ${{ matrix.os }}

    steps:
    - name: Check out Git repository
      uses: actions/checkout@v7

    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 12

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Download verified tool bundle
      uses: actions/download-artifact@v8
      with:
        name: ${{ matrix.target }}-tools
        path: build-tools/${{ matrix.target }}

    - name: Prepare and verify tool bundle
      shell: bash
      run: |
        mkdir -p "build-tools/win-${{ matrix.arch }}"
        cp -r "build-tools/${{ matrix.target }}/"* "build-tools/win-${{ matrix.arch }}/"
        "build-tools/${{ matrix.target }}/yt-dlp.exe" --version
        "build-tools/${{ matrix.target }}/ffmpeg.exe" -version
        "build-tools/${{ matrix.target }}/ffmpeg.exe" -filters 2>&1 | grep -E '[[:space:]]subtitles[[:space:]]'

    - name: Build Windows installer
      run: pnpm exec electron-builder build ${{ matrix.builder_args }} --publish never

    - name: Upload Windows installer
      uses: actions/upload-artifact@v7
      with:
        name: windows-${{ matrix.arch }}-installer
        path: dist/
        if-no-files-found: error
