name: Lint

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '*.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/lint.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - '*.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/lint.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.event_name == 'pull_request' || !startsWith(github.event.head_commit.message, 'Bump version to ')
    runs-on: ubuntu-latest
    steps:
    - name: Check out Git repository
      uses: actions/checkout@v7

    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 12

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run lint
      run: pnpm run lint
