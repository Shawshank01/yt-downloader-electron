name: Release

on:
  push:
    tags:
    - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Check out Git repository
      uses: actions/checkout@v7

    - name: Install pnpm
      uses: pnpm/action-setup@v6

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run lint
      run: pnpm run lint

  release:
    needs: lint
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
        - os: macos-latest
          build_script: build:mac
        - os: windows-latest
          build_script: build:win
        - os: ubuntu-latest
          build_script: build:linux:x64
        - os: ubuntu-24.04-arm
          build_script: build:linux:arm64

    steps:
    - name: Check out Git repository
      uses: actions/checkout@v7

    - name: Install pnpm
      uses: pnpm/action-setup@v6

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build Electron app
      run: pnpm run ${{ matrix.build_script }}

    - name: List build artifacts
      shell: bash
      run: |
        echo "=== Build artifacts for ${{ runner.os }} (${{ runner.arch }}) ==="
        ls -la dist/ || echo "dist/ directory not found"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ runner.os }}-${{ runner.arch }}-build
        path: dist/

  upload_release:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
    - name: Check out Git repository (for tag annotations)
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Download all build artifacts
      uses: actions/download-artifact@v8
      with:
        path: dist/
        merge-multiple: true

    - name: List all downloaded artifacts
      shell: bash
      run: |
        echo "=== All downloaded artifacts ==="
        find dist/ -type f -print

    - name: Prepare release assets
      shell: bash
      run: |
        mkdir release_assets
        echo "Moving release assets..."
        find dist -type f -name "*.dmg" -exec mv {} release_assets/ \;
        find dist -type f -name "YT-Downloader-*.exe" -exec mv {} release_assets/ \;
        find dist -type f -name "*.AppImage" -exec mv {} release_assets/ \;
        find dist -type f -name "latest*.yml" -exec mv {} release_assets/ \;
        # Try to collect release notes from the tag annotation if available
        TAG_NAME=${{ github.ref_name }}
        echo "Fetching annotated tag message for $TAG_NAME..."
        # Try to read tag annotation locally first
        git tag -l --format='%(contents)' "$TAG_NAME" > release_notes.txt 2>/dev/null || true
        # Remove PGP signature block if present
        sed -i '/-----BEGIN PGP SIGNATURE-----/,$d' release_notes.txt
        # Trim leading/trailing whitespace/newlines
        sed -i -e :a -e '/^\n*$/{$d;N;ba' -e '}' release_notes.txt
        echo "Release notes content:"
        cat release_notes.txt
        echo "Final assets to be released:"
        ls -l release_assets

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        generate_release_notes: false
        body_path: release_notes.txt
        files: release_assets/*
