name: Release

on:
  push:
    tags:
    - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Check out Git repository
      uses: actions/checkout@v7

    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 12

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run lint
      run: pnpm run lint

  release:
    needs: [ lint, tools ]
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-15
          arch: x64
          target: darwin-x64
          builder_args: --mac --x64
        - os: macos-26
          arch: arm64
          target: darwin-arm64
          builder_args: --mac --arm64
        - os: windows-latest
          arch: x64
          target: win32-x64
          builder_args: --win --x64
        - os: windows-11-arm
          arch: arm64
          target: win32-arm64
          builder_args: --win --arm64
        - os: ubuntu-latest
          arch: x64
          target: linux-x64
          builder_args: --linux AppImage --x64
        - os: ubuntu-24.04-arm
          arch: arm64
          target: linux-arm64
          builder_args: --linux AppImage --arm64

    steps:
    - name: Check out Git repository
      uses: actions/checkout@v7

    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 12

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Download verified tool bundle
      uses: actions/download-artifact@v8
      with:
        name: ${{ matrix.target }}-tools
        path: build-tools/${{ matrix.target }}

    - name: Prepare tool bundle for electron-builder
      shell: bash
      run: |
        case "${{ matrix.target }}" in
          darwin-*) os_dir="mac-${{ matrix.arch }}" ;;
          win32-*)  os_dir="win-${{ matrix.arch }}" ;;
          linux-*)  os_dir="linux-${{ matrix.arch }}" ;;
          *)        os_dir="" ;;
        esac
        if [ -n "$os_dir" ] && [ "$os_dir" != "${{ matrix.target }}" ]; then
          mkdir -p "build-tools/$os_dir"
          cp -r "build-tools/${{ matrix.target }}/"* "build-tools/$os_dir/"
        fi
        if [ "${{ runner.os }}" != "Windows" ]; then
          find build-tools -type f -exec chmod 755 {} +
          test -s "build-tools/${{ matrix.target }}/deno"
          "build-tools/${{ matrix.target }}/yt-dlp" --version
          "build-tools/${{ matrix.target }}/ffmpeg" -version
        else
          test -s "build-tools/${{ matrix.target }}/deno.exe"
        fi

    - name: Build Electron app
      run: pnpm exec electron-builder build ${{ matrix.builder_args }} --publish never

    - name: List build artifacts
      shell: bash
      run: |
        echo "=== Build artifacts for ${{ runner.os }} (${{ runner.arch }}) ==="
        ls -la dist/ || echo "dist/ directory not found"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.os }}-${{ matrix.arch }}-build
        path: dist/

  upload_release:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
    - name: Check out Git repository (for tag annotations)
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Download all build artifacts
      uses: actions/download-artifact@v8
      with:
        path: dist/
        merge-multiple: true

    - name: List all downloaded artifacts
      shell: bash
      run: |
        echo "=== All downloaded artifacts ==="
        find dist/ -type f -print

    - name: Prepare release assets
      shell: bash
      run: |
        mkdir release_assets
        echo "Moving release assets..."
        find dist -type f -name "*.dmg" -exec mv {} release_assets/ \;
        find dist -type f -name "YT-Downloader-*.exe" -exec mv {} release_assets/ \;
        find dist -type f -name "*.AppImage" -exec mv {} release_assets/ \;
        find dist -type f -name "latest*.yml" -exec mv {} release_assets/ \;
        # Try to collect release notes from the tag annotation if available
        TAG_NAME=${{ github.ref_name }}
        echo "Fetching annotated tag message for $TAG_NAME..."
        # Try to read tag annotation locally first
        git tag -l --format='%(contents)' "$TAG_NAME" > release_notes.txt 2>/dev/null || true
        # Remove PGP signature block if present
        sed -i '/-----BEGIN PGP SIGNATURE-----/,$d' release_notes.txt
        # Trim leading/trailing whitespace/newlines
        sed -i -e :a -e '/^\n*$/{$d;N;ba' -e '}' release_notes.txt
        echo "Release notes content:"
        cat release_notes.txt
        echo "Final assets to be released:"
        ls -l release_assets

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        generate_release_notes: false
        body_path: release_notes.txt
        files: release_assets/*

    - name: Update Homebrew Tap
      if: success()
      env:
        TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        TAG_NAME: ${{ github.ref_name }}
      shell: bash
      run: |
        if [ -z "$TAP_TOKEN" ]; then
          echo "HOMEBREW_TAP_TOKEN secret is not set. Skipping Homebrew tap update."
          exit 0
        fi

        VER="${TAG_NAME#v}"
        ARM64_DMG=$(find release_assets -type f -name "YT-Downloader-mac-arm64-*.dmg" | head -n 1)
        X64_DMG=$(find release_assets -type f -name "YT-Downloader-mac-x64-*.dmg" | head -n 1)

        if [ -z "$ARM64_DMG" ] || [ -z "$X64_DMG" ]; then
          echo "macOS DMG files not found in release_assets. Skipping Homebrew tap update."
          exit 0
        fi

        ARM64_SHA=$(sha256sum "$ARM64_DMG" | awk '{print $1}')
        X64_SHA=$(sha256sum "$X64_DMG" | awk '{print $1}')

        echo "Updating Homebrew tap to version $VER..."
        echo "arm64 sha256: $ARM64_SHA"
        echo "x64 sha256:   $X64_SHA"

        git clone "https://x-access-token:${TAP_TOKEN}@github.com/Shawshank01/homebrew-tap.git" homebrew-tap
        mkdir -p homebrew-tap/Casks

        cat <<EOF | sed 's/^        //' > homebrew-tap/Casks/yt-downloader.rb
        cask "yt-downloader" do
          version "${VER}"

          on_arm do
            sha256 "${ARM64_SHA}"
            url "https://github.com/Shawshank01/yt-downloader-electron/releases/download/v#{version}/YT-Downloader-mac-arm64-#{version}.dmg"
          end
          on_intel do
            sha256 "${X64_SHA}"
            url "https://github.com/Shawshank01/yt-downloader-electron/releases/download/v#{version}/YT-Downloader-mac-x64-#{version}.dmg"
          end

          name "YT Downloader"
          desc "Video downloader using yt-dlp and FFmpeg with AI assistance"
          homepage "https://github.com/Shawshank01/yt-downloader-electron"

          app "YT Downloader.app"

          # Automatically strips quarantine upon installation
          postflight_steps do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{appdir}}/YT Downloader.app"]
          end

          zap trash: [
            "~/Library/Application Support/yt-downloader-electron",
            "~/Library/Preferences/com.ytdownloader.app.plist",
          ]
        end
        EOF

        cd homebrew-tap
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add Casks/yt-downloader.rb

        if git diff --staged --quiet; then
          echo "No changes to commit in homebrew-tap."
        else
          git commit -m "chore(cask): update yt-downloader to ${VER}"
          git push origin main
        fi

  tools:
    uses: ./.github/workflows/build-tools.yml
