name: Build tool bundles

on:
  workflow_call:
    inputs:
      scope:
        required: false
        type: string
        default: all
  workflow_dispatch:
    inputs:
      scope:
        description: Tool platforms to build
        required: true
        type: choice
        options:
        - all
        - windows
        default: all


permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-15
          arch: x64
          target: darwin-x64
        - os: macos-26
          arch: arm64
          target: darwin-arm64
        - os: ubuntu-latest
          arch: x64
          target: win32-x64
        - os: ubuntu-latest
          arch: arm64
          target: win32-arm64
        - os: ubuntu-latest
          arch: x64
          target: linux-x64
        - os: ubuntu-24.04-arm
          arch: arm64
          target: linux-arm64

    steps:
    - name: Check out Git repository
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 26

    - name: Install FFmpeg build dependencies (macOS)
      if: runner.os == 'macOS' && inputs.scope != 'windows'
      run: brew install nasm pkg-config libass

    - name: Install FFmpeg build dependencies (Linux)
      if: runner.os == 'Linux' && !startsWith(matrix.target, 'win32-') && inputs.scope != 'windows'
      run: |
        sudo apt-get update
        sudo apt-get install -y nasm yasm pkg-config libass-dev

    - name: Install Windows FFmpeg build dependencies
      if: startsWith(matrix.target, 'win32-')
      run: |
        sudo apt-get update
        sudo apt-get install -y autoconf automake autopoint cmake \
          libtool make meson ninja-build pkg-config nasm yasm

    - name: Prepare tool bundle
      if: inputs.scope != 'windows' || startsWith(matrix.target, 'win32-')
      env:
        TOOL_TARGET: ${{ matrix.target }}
      run: node scripts/prepare-tools.mjs

    - name: Build Windows FFmpeg with LLVM-MinGW
      if: startsWith(matrix.target, 'win32-')
      env:
        TOOL_TARGET: ${{ matrix.target }}
      run: bash scripts/build-windows-ffmpeg.sh

    - name: Build FFmpeg from official source
      if: (startsWith(matrix.target, 'darwin-') || startsWith(matrix.target, 'linux-')) && inputs.scope != 'windows'
      shell: bash
      run: |
        set -euo pipefail
        VERSION="$(node -p "require('./tools-versions.json').ffmpeg")"
        curl --fail --location --retry 5 --retry-all-errors \
          --output ffmpeg.tar.xz "https://ffmpeg.org/releases/ffmpeg-${VERSION}.tar.xz"
        tar -xf ffmpeg.tar.xz
        cd "ffmpeg-${VERSION}"

        CONFIGURE_ARGS=(
          --prefix="$GITHUB_WORKSPACE/build-tools/${{ matrix.target }}"
          --enable-gpl
          --enable-libass
          --enable-filter=subtitles
          --enable-static
          --disable-shared
          --disable-debug
          --disable-doc
        )

        if [ "${{ matrix.target }}" = "darwin-x64" ] || [ "${{ matrix.target }}" = "darwin-arm64" ]; then
          ./configure "${CONFIGURE_ARGS[@]}" --cc=clang --disable-indev=jack
        else
          ./configure "${CONFIGURE_ARGS[@]}"
        fi

        make -j2
        make install
        mkdir -p "$GITHUB_WORKSPACE/build-tools/${{ matrix.target }}"
        cp "$GITHUB_WORKSPACE/build-tools/${{ matrix.target }}/bin/ffmpeg" \
          "$GITHUB_WORKSPACE/build-tools/${{ matrix.target }}/ffmpeg" 2>/dev/null || true
        cp "$GITHUB_WORKSPACE/build-tools/${{ matrix.target }}/bin/ffprobe" \
          "$GITHUB_WORKSPACE/build-tools/${{ matrix.target }}/ffprobe" 2>/dev/null || true
        if [[ "${{ matrix.target }}" == win32-* ]]; then
          mv "$GITHUB_WORKSPACE/build-tools/${{ matrix.target }}/bin/ffmpeg.exe" \
            "$GITHUB_WORKSPACE/build-tools/${{ matrix.target }}/ffmpeg.exe"
          mv "$GITHUB_WORKSPACE/build-tools/${{ matrix.target }}/bin/ffprobe.exe" \
            "$GITHUB_WORKSPACE/build-tools/${{ matrix.target }}/ffprobe.exe"
        fi

    - name: Verify tool bundle
      if: inputs.scope != 'windows' || startsWith(matrix.target, 'win32-')
      shell: bash
      run: |
        TOOL_DIR="build-tools/${{ matrix.target }}"
        if [[ "${{ matrix.target }}" == win32-* ]]; then
          "$TOOL_DIR/yt-dlp.exe" --version
          "$TOOL_DIR/ffmpeg.exe" -version
          "$TOOL_DIR/ffmpeg.exe" -filters 2>&1 | grep -E '[[:space:]]subtitles[[:space:]]'
        else
          "$TOOL_DIR/yt-dlp" --version
          "$TOOL_DIR/ffmpeg" -version
          "$TOOL_DIR/ffmpeg" -filters 2>&1 | grep -E '[[:space:]]subtitles[[:space:]]'
        fi

    - name: Generate checksums
      if: inputs.scope != 'windows' || startsWith(matrix.target, 'win32-')
      shell: bash
      run: |
        cd "build-tools/${{ matrix.target }}"
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum yt-dlp* ffmpeg* > SHA256SUMS
        else
          shasum -a 256 yt-dlp* ffmpeg* > SHA256SUMS
        fi

    - name: Upload verified tool bundle
      if: inputs.scope != 'windows' || startsWith(matrix.target, 'win32-')
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.target }}-tools
        path: build-tools/${{ matrix.target }}/
        if-no-files-found: error
