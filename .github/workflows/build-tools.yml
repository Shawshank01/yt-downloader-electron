name: Build tool bundles

on:
  workflow_call:
    inputs:
      scope:
        required: false
        type: string
        default: all
  workflow_dispatch:
    inputs:
      scope:
        description: Tool platforms to build
        required: true
        type: choice
        options:
        - all
        - windows
        default: all

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-15
          arch: x64
          target: darwin-x64
        - os: macos-26
          arch: arm64
          target: darwin-arm64
        - os: ubuntu-latest
          arch: x64
          target: win32-x64
        - os: ubuntu-latest
          arch: arm64
          target: win32-arm64
        - os: ubuntu-latest
          arch: x64
          target: linux-x64
        - os: ubuntu-24.04-arm
          arch: arm64
          target: linux-arm64

    steps:
    - name: Check out Git repository
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 26

    - name: Install macOS FFmpeg build dependencies
      if: runner.os == 'macOS' && inputs.scope != 'windows'
      run: brew install autoconf automake libtool cmake meson ninja pkg-config nasm yasm

    - name: Install Windows FFmpeg build dependencies
      if: startsWith(matrix.target, 'win32-')
      run: |
        sudo apt-get update
        sudo apt-get install -y autoconf automake autopoint cmake \
          file libtool make meson ninja-build pkg-config nasm yasm

    - name: Prepare tool bundle
      if: inputs.scope != 'windows' || startsWith(matrix.target, 'win32-')
      env:
        TOOL_TARGET: ${{ matrix.target }}
      run: node scripts/prepare-tools.mjs

    - name: Build Windows FFmpeg with LLVM-MinGW
      if: startsWith(matrix.target, 'win32-')
      env:
        TOOL_TARGET: ${{ matrix.target }}
      run: bash scripts/build-windows-ffmpeg.sh

    - name: Build macOS FFmpeg with static libass
      if: startsWith(matrix.target, 'darwin-') && inputs.scope != 'windows'
      env:
        TOOL_TARGET: ${{ matrix.target }}
      run: bash scripts/build-macos-ffmpeg.sh

    - name: Verify tool bundle
      if: inputs.scope != 'windows' || startsWith(matrix.target, 'win32-')
      shell: bash
      run: |
        TOOL_DIR="build-tools/${{ matrix.target }}"
        if [[ "${{ matrix.target }}" == win32-* ]]; then
          test -s "$TOOL_DIR/yt-dlp.exe"
          test -s "$TOOL_DIR/ffmpeg.exe"
          test -s "$TOOL_DIR/ffprobe.exe"
          file "$TOOL_DIR/ffmpeg.exe" | grep -Ei 'PE32\+? executable'
        else
          "$TOOL_DIR/yt-dlp" --version
          "$TOOL_DIR/ffmpeg" -version
          "$TOOL_DIR/ffmpeg" -filters 2>&1 | grep -E '[[:space:]]subtitles[[:space:]]'
          if [ "${{ runner.os }}" = "macOS" ]; then
            if otool -L "$TOOL_DIR/ffmpeg" | grep -E '/opt/homebrew|/usr/local/opt'; then
              echo "Error: ffmpeg dynamically links to Homebrew libraries!" >&2
              exit 1
            fi
          fi
        fi

    - name: Generate checksums
      if: inputs.scope != 'windows' || startsWith(matrix.target, 'win32-')
      shell: bash
      run: |
        cd "build-tools/${{ matrix.target }}"
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum yt-dlp* ffmpeg* > SHA256SUMS
        else
          shasum -a 256 yt-dlp* ffmpeg* > SHA256SUMS
        fi

    - name: Upload verified tool bundle
      if: inputs.scope != 'windows' || startsWith(matrix.target, 'win32-')
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.target }}-tools
        path: build-tools/${{ matrix.target }}/
        if-no-files-found: error
