name: Check bundled tools

on:
  schedule:
  - cron: '17 3 * * *'
  workflow_dispatch:


permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v7

    - name: Update upstream tool versions
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        node --input-type=module <<'NODE'
        import fs from 'node:fs';
        const versions = JSON.parse(fs.readFileSync('tools-versions.json', 'utf8'));
        const get = async (url) => {
          const headers = { 'User-Agent': 'yt-downloader-tool-check' };
          if (process.env.GITHUB_TOKEN) {
            headers.Authorization = `Bearer ${process.env.GITHUB_TOKEN}`;
          }
          const response = await fetch(url, { headers });
          if (!response.ok) throw new Error(`${response.status} ${url}`);
          return response.json();
        };
        const yt = await get('https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest');
        const ffmpegTags = await get('https://api.github.com/repos/FFmpeg/FFmpeg/tags?per_page=100');
        const latestFfmpegTag = ffmpegTags
          .map((t) => t.name)
          .filter((name) => /^n\d+\.\d+(\.\d+)?$/.test(name))
          .sort((a, b) => b.localeCompare(a, undefined, { numeric: true }))[0];
        const deno = await get('https://api.github.com/repos/denoland/deno/releases/latest');
        versions['yt-dlp'] = yt.tag_name;
        if (latestFfmpegTag) {
          versions['ffmpeg'] = latestFfmpegTag.replace(/^n/, '');
        }
        versions['deno'] = deno.tag_name.replace(/^v/, '');
        fs.writeFileSync('tools-versions.json', `${JSON.stringify(versions, null, 2)}\n`);
        NODE

    - name: Open update pull request
      uses: peter-evans/create-pull-request@v8
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: Update bundled yt-dlp and FFmpeg
        title: Update bundled yt-dlp and FFmpeg
        body: |
          Automated daily check of the upstream yt-dlp and FFmpeg releases.

          This PR intentionally requires manual review and merge before release builds use the new bundle.
        branch: automation/update-bundled-tools
        delete-branch: true
